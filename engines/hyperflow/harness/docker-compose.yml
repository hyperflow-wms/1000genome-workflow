version: '3.8'

services:
  # Redis server for HyperFlow job queue
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - hyperflow-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  # HyperFlow workflow engine
  hyperflow:
    image: ${HF_ENGINE_IMAGE:-hyperflowwms/hyperflow:v1.11.1}
    container_name: hyperflow-engine
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - hyperflow-net
    environment:
      # Redis connection
      - REDIS_URL=redis://redis:6379

      # HyperFlow configuration
      - HF_VAR_WORKER_CONTAINER=${HF_VAR_WORKER_CONTAINER:-hyperflowwms/1000genome-worker:1.7-je1.4.2}
      - HF_VAR_WORK_DIR=${WORKFLOW_DIR}
      - HF_VAR_HFLOW_IN_CONTAINER=true
      - HF_VAR_function=redisCommand
      - HF_VAR_REDIS_CMD_MAX_PARALLELISM=${MAX_PARALLELISM:-20}

      # Completion-notification transport: Redis Streams (job-executor >= 1.4.0)
      - HF_VAR_COMPLETION_TRANSPORT=stream

      # Console verbosity (error|warn|info|debug); ignored by engine images
      # that predate the leveled console logger
      - HF_VAR_CONSOLE_LOG_LEVEL=${HF_VAR_CONSOLE_LOG_LEVEL:-info}

      # Level of the per-task trace files under <workflow dir>/logs-hf
      # (independent of console verbosity; default 'info')
      - HF_VAR_LOG_LEVEL=${HF_VAR_LOG_LEVEL:-info}

      # Colored output. The engine's stdout is a pipe, so it cannot detect a
      # terminal itself; the launcher sets FORCE_COLOR when the far end is one.
      # Passed through without a default: node warns if both are defined, even
      # when one of them is empty.
      - FORCE_COLOR
      - NO_COLOR

      # Run workers as current user to avoid root-owned files
      - USER_ID=${USER_ID}
      - USER_GID=${USER_GID}

    volumes:
      # Mount Docker socket to spawn worker containers
      - /var/run/docker.sock:/var/run/docker.sock

      # Mount workflow directory
      - ${WORKFLOW_DIR:-./workflow}:/workflow

    working_dir: /workflow

    entrypoint: /bin/sh
    command: >
      -c "
      (command -v docker >/dev/null || (echo 'Installing Docker client...' && apk add --no-cache docker-cli)) &&
      sleep 2 &&
      echo 'Starting HyperFlow...' &&
      hflow run /workflow/workflow.json
      "

networks:
  hyperflow-net:
    name: hyperflow-net
    driver: bridge

volumes:
  redis-data:
