version: '1.0'
defaults:
  parallelism: small
  populations_dir: ${REPO_ROOT}/workflow-generator/data/populations
  compute_environment: local
volume_thresholds:
  stop_before_extract_mb: 500
  stop_before_execute_mb: 50
test_cases:
- id: eur-afr-chr22
  name: European vs African deleterious mutations on chromosome 22
  description: 'Tests population comparison workflow for a single chromosome.

    Chromosome 22 is the smallest autosome. PLAN estimates ~190 MB transfer

    and ~3.8 GB on disk, which clears the 50 MB execute threshold, so this

    stops before execution by default.

    '
  prompt: 'Do European and African populations show different patterns of shared

    deleterious mutations on chromosome 22? This is relevant for understanding

    population-specific disease risks.

    '
  expected_intent:
    analysis_type: population_comparison
    populations:
    - EUR
    - AFR
    chromosomes:
    - '22'
    focus: deleterious
  mock_intent:
    analysis_type: population_comparison
    populations:
    - EUR
    - AFR
    chromosomes:
    - '22'
    regions: null
    focus: deleterious
  expected_outputs:
  - chr22-EUR.tar.gz
  - chr22-AFR.tar.gz
  - chr22-EUR-freq.tar.gz
  - chr22-AFR-freq.tar.gz
- id: genome-wide-null
  name: Genome-wide mutation sharing null distribution
  description: 'Establishes statistical baseline for mutation sharing patterns.

    This requires ALL chromosomes (PLAN estimates ~13.8 GB transfer, ~270 GB on

    disk) and is too large for routine testing.

    By default, stops after ESTIMATE phase.

    '
  prompt: 'What is the genome-wide null distribution of mutation sharing across all

    populations? This provides the statistical baseline needed to evaluate

    whether disease-associated mutations show unusual sharing patterns.

    '
  expected_intent:
    analysis_type: multi_population
    populations:
    - AFR
    - ALL
    - AMR
    - EAS
    - EUR
    - GBR
    - SAS
    chromosomes: null
    focus: all_variants
  mock_intent:
    analysis_type: multi_population
    populations:
    - AFR
    - ALL
    - AMR
    - EAS
    - EUR
    - GBR
    - SAS
    chromosomes: null
    regions: null
    focus: all_variants
- id: eas-hla-autoimmune
  name: East Asian HLA region autoimmune susceptibility
  description: 'Tests region-based analysis with the well-known HLA region.

    The HLA region spans ~5 Mb and transfers ~25 MB compressed, which keeps it

    under the run-end-to-end threshold. It expands to ~1.6 GB on disk, so the

    run is cheap to fetch but not free to execute.

    '
  prompt: 'Do East Asian populations show distinct mutation sharing patterns in the

    HLA immune region that could explain population-specific autoimmune

    disease susceptibilities?

    '
  expected_intent:
    analysis_type: region_analysis
    populations:
    - EAS
    regions:
    - name: HLA
      chromosome: '6'
    focus: all_variants
  mock_intent:
    analysis_type: region_analysis
    populations:
    - EAS
    chromosomes: null
    regions:
    - name: HLA
      chromosome: '6'
      start: 28477797
      end: 33448354
      context: immune function
    focus: all_variants
  expected_outputs:
  - chr6-EAS.tar.gz
  - chr6-EAS-freq.tar.gz
- id: micro
  name: Micro dataset smoke test
  description: 'Minimal test using pre-existing micro dataset (10,000 variants).

    This bypasses the INTERPRET and EXTRACT phases entirely.

    Used for rapid smoke testing of the generator and execution.

    '
  prompt: null
  skip_interpret: true
  skip_extract: true
  data_csv: ${SCRIPT_DIR}/data-micro.csv
  mock_intent:
    analysis_type: multi_population
    populations:
    - AFR
    - ALL
    - AMR
    - EAS
    - EUR
    - GBR
    - SAS
    chromosomes:
    - '1'
    regions: null
    focus: all_variants
  expected_outputs:
  - chr1-AFR.tar.gz
  - chr1-ALL.tar.gz
  - chr1-AMR.tar.gz
  - chr1-EAS.tar.gz
  - chr1-EUR.tar.gz
  - chr1-GBR.tar.gz
  - chr1-SAS.tar.gz
  - chr1-AFR-freq.tar.gz
  - chr1-ALL-freq.tar.gz
  - chr1-AMR-freq.tar.gz
  - chr1-EAS-freq.tar.gz
  - chr1-EUR-freq.tar.gz
  - chr1-GBR-freq.tar.gz
  - chr1-SAS-freq.tar.gz
- id: eur-afr-hla
  name: European vs African HLA region comparison
  description: 'Population comparison in a specific genomic region.

    Combines region-based extraction with population comparison.

    Good balance of coverage and execution time.

    '
  prompt: 'Compare the patterns of genetic variation between European and African

    populations in the HLA region. Are there population-specific variants

    that might explain differences in immune response?

    '
  expected_intent:
    analysis_type: population_comparison
    populations:
    - EUR
    - AFR
    regions:
    - name: HLA
      chromosome: '6'
    focus: all_variants
  mock_intent:
    analysis_type: population_comparison
    populations:
    - EUR
    - AFR
    chromosomes: null
    regions:
    - name: HLA
      chromosome: '6'
      start: 28477797
      end: 33448354
      context: immune function
    focus: all_variants
  expected_outputs:
  - chr6-EUR.tar.gz
  - chr6-AFR.tar.gz
  - chr6-EUR-freq.tar.gz
  - chr6-AFR-freq.tar.gz
- id: brca-breast-cancer
  name: BRCA1/BRCA2 breast cancer variant analysis
  description: 'Analyzes breast cancer susceptibility genes across all populations.

    Tests multi-region extraction (BRCA1 on chr17, BRCA2 on chr13).

    '
  prompt: 'What variants exist in the BRCA1 and BRCA2 breast cancer genes across

    different populations? Are there population-specific patterns that might

    inform targeted screening recommendations?

    '
  expected_intent:
    analysis_type: multi_population
    populations:
    - AFR
    - EUR
    - EAS
    - SAS
    - AMR
    regions:
    - name: BRCA1
      chromosome: '17'
    - name: BRCA2
      chromosome: '13'
    focus: all_variants
  mock_intent:
    analysis_type: multi_population
    populations:
    - AFR
    - EUR
    - EAS
    - SAS
    - AMR
    chromosomes: null
    regions:
    - name: BRCA1
      chromosome: '17'
      start: 43044295
      end: 43125483
      context: breast cancer
    - name: BRCA2
      chromosome: '13'
      start: 32315086
      end: 32400266
      context: breast cancer
    focus: all_variants
  expected_outputs:
  - chr17-AFR.tar.gz
  - chr17-EUR.tar.gz
  - chr17-EAS.tar.gz
  - chr17-SAS.tar.gz
  - chr17-AMR.tar.gz
  - chr13-AFR.tar.gz
  - chr13-EUR.tar.gz
  - chr13-EAS.tar.gz
  - chr13-SAS.tar.gz
  - chr13-AMR.tar.gz
  - chr17-AFR-freq.tar.gz
  - chr17-EUR-freq.tar.gz
  - chr17-EAS-freq.tar.gz
  - chr17-SAS-freq.tar.gz
  - chr17-AMR-freq.tar.gz
  - chr13-AFR-freq.tar.gz
  - chr13-EUR-freq.tar.gz
  - chr13-EAS-freq.tar.gz
  - chr13-SAS-freq.tar.gz
  - chr13-AMR-freq.tar.gz
- id: brca1-gbr
  name: BRCA1 variants in British population
  description: 'Minimal test case: single gene region (BRCA1 on chr17), single small

    population (GBR, 91 individuals). Designed to be the fastest possible

    end-to-end test. ~8 tasks, runs in under a minute.

    '
  prompt: 'Analyze BRCA1 gene variants in the British population.

    '
  expected_intent:
    analysis_type: region_analysis
    populations:
    - GBR
    regions:
    - name: BRCA1
      chromosome: '17'
    focus: all_variants
  mock_intent:
    analysis_type: region_analysis
    populations:
    - GBR
    chromosomes: null
    regions:
    - name: BRCA1
      chromosome: '17'
      start: 43044295
      end: 43125483
      context: breast cancer
    focus: all_variants
  expected_outputs:
  - chr17-GBR.tar.gz
  - chr17-GBR-freq.tar.gz
- id: apoe-gbr
  name: APOE variants in British population
  prompt: 'Analyze APOE gene variants associated with Alzheimer''s disease in the
    British population.

    '
  description: 'Smallest region in the evaluation at 113 variants, fewer than a VCF''s
    253 header lines. Before RFC-005 the individuals stage processed none of them
    and emitted one empty file per individual while still exiting 0.

    '
  mock_intent:
    analysis_type: region_analysis
    populations:
    - GBR
    chromosomes: null
    regions:
    - name: APOE
      chromosome: '19'
      start: 44905796
      end: 44909393
      context: Alzheimer's
    focus: all_variants
- id: q3-multi-region
  name: Sickle cell, cystic fibrosis and Alzheimer's across five super-populations
  prompt: 'Investigate HBB gene variants related to sickle cell trait, CFTR variants
    linked to cystic fibrosis, and APOE variants associated with Alzheimer''s disease
    across all five super-populations.

    '
  description: 'Q3 of the end-to-end evaluation. Two of its three regions, HBB at
    136

    variants and APOE at 113, are smaller than a VCF''s 253 header lines, so

    before RFC-005 they contributed no variants at all while the workflow

    still reported every task successful.

    '
  mock_intent:
    analysis_type: multi_population
    populations:
    - AFR
    - AMR
    - EAS
    - EUR
    - SAS
    chromosomes: null
    regions:
    - name: HBB
      chromosome: '11'
      start: 5225464
      end: 5229395
      context: sickle cell
    - name: CFTR
      chromosome: '7'
      start: 117120017
      end: 117308718
      context: cystic fibrosis
    - name: APOE
      chromosome: '19'
      start: 44905796
      end: 44909393
      context: Alzheimer's
    focus: all_variants
